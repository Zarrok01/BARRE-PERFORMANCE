/* BARRE 4.0 — Carbone & Cuivre : lisibilité, entraînement prioritaire. */
:root{--bg:#101112;--panel:#202122;--panel2:#282727;--panel3:#302C2A;--line:#49413C;--text:#F5F2ED;--muted:#C0B5AD;--accent:#D1A17B;--warning:#E5B56D;--danger:#F6A3A0;--radius:16px;--shadow:0 14px 40px #00000022}
body{background:radial-gradient(circle at 70% 0%,#30231C 0%,transparent 40%),#101112;color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.app{max-width:650px}
.hero{background:linear-gradient(140deg,#33261E,#1A1B1C 70%,#22201F);border-color:#554238}
.hero:after{content:''}
.hero-tail{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:7px 0 -7px;flex-wrap:wrap}
.hero-tail .text-button{font-size:12px;color:#E5BEA2;min-height:44px;padding:8px 5px}
.intro-card{background:linear-gradient(120deg,#272321,#202122);border-color:#8D674F}
.storage-indicator{padding:11px 12px;border:1px solid #5A5149;border-radius:10px;background:#2C2927;color:#E6C5A8;margin:13px 0;font-size:12px}
.library-item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:12px 2px;min-height:66px}
.library-item>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.library-item strong{font-size:14px}.library-item small{color:var(--muted);font-size:12px}
.library-item:last-child{border-bottom:0}
.library-item:hover{background:#302824}
.trend-svg{display:block;width:100%;max-width:560px;height:auto;margin:15px auto 8px;overflow:visible}
.chart-details{margin-top:10px;color:var(--muted);font-size:12px}
.chart-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--accent);font-weight:650}
.chart-details li{margin:5px 0}
.compare-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:0;margin-top:15px;align-items:center}

.roundbtn{min-width:44px;min-height:44px}
.done-btn{min-height:48px}

.modal .field label{font-size:13px}

/* BARRE 4.1 — Photographic exercise media and lumbar focus */
.exercise-photo-wrap{margin:0;display:block;width:100%;position:relative;min-width:0}

.compact-photo .exercise-photo-wrap{width:100%}
.lumbar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.lumbar-move{min-width:0;background:#262321;border:1px solid #57473D;border-radius:13px;padding:7px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:5px;cursor:pointer}
.lumbar-move:hover,.lumbar-move:focus-visible{border-color:var(--accent)}
.lumbar-move .exercise-photo{aspect-ratio:1.1;object-fit:cover}
.lumbar-move strong{font-size:12px;line-height:1.25}
.lumbar-move span{color:var(--muted);font-size:11px;line-height:1.3}
.library-thumb{flex:0 0 86px;width:86px;height:65px;overflow:hidden;border-radius:9px}
.library-thumb .exercise-photo-wrap,.library-thumb .exercise-photo{width:86px;height:65px;border-radius:8px;object-fit:cover}
.library-thumb .photo-note{display:none}
.library-item>span:nth-child(2){flex:1}
@media(max-width:380px){.lumbar-grid{gap:6px}.lumbar-move{padding:5px}.lumbar-move strong{font-size:11px}.exercise-visual.compact-photo{grid-template-columns:100px minmax(0,1fr)}}

  {label:'Adaptation',slots:['A','B'],tier:0,volume:0,tip:'Commence doucement. Garde 2 répétitions en réserve sur chaque série.'},

const EXERCISES={
 pullP:{name:'Tractions pronation',short:'Dos · Biceps',icon:'↑',unit:'rép.',baseSets:3,base:3,kind:'pull',details:'Prise pronation, épaules contrôlées et mouvement strict. Évite les à-coups et ne cherche pas à tenir une suspension prolongée. Barre parfaitement fixée.'},
 dipAssist:{name:'Dips assistés',short:'Pectoraux · Triceps',icon:'⇵',unit:'rép.',baseSets:2,base:5,kind:'dip',details:'Utilise uniquement des barres à dips solides et stables. Garde un appui stable des pieds si possible, épaules abaissées, coudes contrôlés, amplitude confortable et tronc gainé. Ne descends pas très bas, ne balance pas les jambes. Si impossible de t’aider avec les pieds ou si douleur à l’épaule, choisis les pompes dans les réglages.'},
 dipStrict:{name:'Dips stricts',short:'Pectoraux · Triceps',icon:'⇵',unit:'rép.',baseSets:2,base:3,kind:'dip',details:'Seulement si tu maîtrises déjà plusieurs dips propres sur des barres stables. Épaules contrôlées, légère inclinaison confortable, pas de rebond ni de descente excessive ; évite de cambrer ou balancer les jambes. Arrête si douleur à l’épaule, au sternum, au dos ou irradiation dans la jambe.'},
 push:{name:'Pompes classiques',short:'Pectoraux · Triceps',icon:'↗',unit:'rép.',baseSets:2,base:8,details:'Mains légèrement plus larges que les épaules, tronc stable. Variante genoux au sol si nécessaire. Stoppe en cas de douleur irradiant dans la jambe.'},
 squat:{name:'Squats contrôlés',short:'Cuisses · Fessiers',icon:'↧',unit:'rép.',baseSets:2,base:12,details:'Descends dans une amplitude confortable, sans arrondir de force le dos. Remonte sans à-coups. Réduis l’amplitude si besoin.'},
 bird:{name:'Bird-dog',short:'Lombaires · Gainage profond',icon:'✳',unit:'rép./côté',baseSets:2,base:8,details:'À quatre pattes, tends le bras et la jambe opposés en gardant le bassin immobile et le dos neutre. Maintiens 2 à 3 secondes, puis change de côté. Ne force jamais l’amplitude. Arrête si la douleur ou les fourmillements augmentent.'},
 calves:{name:'Élévations de mollets',short:'Mollets · Chevilles',icon:'↥',unit:'rép.',baseSets:2,base:15,details:'Debout près d’un mur pour l’équilibre, monte puis redescends lentement sur la pointe des pieds.'},
 pullS:{name:'Tractions supination',short:'Biceps · Grand dorsal',icon:'↑',unit:'rép.',baseSets:3,base:3,kind:'pull',details:'Paumes vers toi, poignets confortables, coude contrôlé. Si cette prise gêne, remplace par des tractions pronation faciles.'},
 rowIncline:{name:'Tractions australiennes inclinées',short:'Milieu du dos · Arrière des épaules',icon:'↔',unit:'rép.',baseSets:2,base:8,kind:'row',details:'Barre basse solidement ancrée et conçue pour supporter une traction horizontale : jamais une barre de porte non prévue pour cet usage. Pieds fermement au sol, genoux fléchis si cela aide à garder un tronc confortable, corps aligné, tire la poitrine vers la barre sans à-coup. Plus le corps est vertical, plus le mouvement est facile. Interromps en cas de gêne lombaire, de douleur dans la jambe ou de fourmillements.'},
 rowHorizontal:{name:'Tractions australiennes horizontales',short:'Milieu du dos · Biceps · Omoplates',icon:'↔',unit:'rép.',baseSets:2,base:6,kind:'row',details:'Variante plus exigeante, seulement avec un support très stable adapté au tirage horizontal. Pieds en appui sûr, tronc aligné sans cambrure forcée, coudes contrôlés, omoplates mobiles, aucun balancement. N’augmente pas l’inclinaison si cela provoque douleur lombaire ou irradiation dans la jambe.'},
 pike:{name:'Pompes en V',short:'Épaules · Triceps',icon:'◆',unit:'rép.',baseSets:2,base:6,details:'Bassin relevé, descends les épaules progressivement. Remplace par des pompes classiques si la position gêne le dos.'},
 lunge:{name:'Fentes arrière',short:'Cuisses · Équilibre',icon:'↙',unit:'rép./jambe',baseSets:2,base:8,details:'Recule un pied, descends verticalement à ton amplitude confortable. Utilise un appui stable si nécessaire.'},
 bridge:{name:'Pont fessier',short:'Fessiers · Stabilité lombaire',icon:'⌒',unit:'rép.',baseSets:2,base:12,details:'Allongé sur le dos, plie les genoux, pieds posés au sol. Contracte les fessiers puis soulève lentement le bassin sans cambrer. Redescends de façon contrôlée. Arrête si des symptômes apparaissent dans la jambe.'},
 side:{name:'Gainage latéral sur les genoux',short:'Stabilité latérale du tronc',icon:'▰',unit:'s/côté',baseSets:2,base:15,details:'Place-toi sur le côté, en appui sur l’avant-bras et les genoux fléchis. Soulève le bassin sans tourner ni creuser le dos et maintiens 15 à 20 secondes par côté. Arrête en cas de douleur irradiant dans la jambe ou de fourmillements.'}
};
EXERCISES.squatTempo={name:'Squats tempo (3 secondes)',short:'Cuisses · Contrôle',icon:'↧',unit:'rép.',baseSets:2,base:8,kind:'leg',details:'Descends pendant environ 3 secondes, sans aller au-delà de ton amplitude confortable. Remonte normalement sans à-coup. Ne force pas si une douleur descend dans la jambe.'};
EXERCISES.bridgeSingle={name:'Pont fessier unilatéral',short:'Fessiers · Stabilité',icon:'⌒',unit:'rép./côté',baseSets:2,base:6,kind:'leg',details:'En appui sur un pied, relève doucement le bassin sans tourner ni cambrer. Réduis le mouvement ou reviens au pont bilatéral si la position gêne ton dos ou déclenche des symptômes.'};

EXERCISES.hang={name:'Suspension active',short:'Épaules · Avant-bras · Prise',icon:'↑',unit:'s',baseSets:3,base:15,kind:'pullPrep',details:'Suspendu bras tendus, prise pronation largeur d’épaules. Tire les épaules vers le bas, loin des oreilles, sans plier les coudes ; tronc gainé, jambes immobiles. Tiens la position puis redescends en douceur. Arrête si l’épaule fait mal ou si le dos ou la jambe réagissent.'};
EXERCISES.scap={name:'Tirages scapulaires',short:'Bas des trapèzes · Dos',icon:'↑',unit:'rép.',baseSets:3,base:6,kind:'pullPrep',details:'Depuis la suspension bras tendus, abaisse et rapproche les omoplates pour monter de quelques centimètres, coudes toujours tendus. Marque 1 seconde en haut, redescends lentement. Mouvement court, sans balancer.'};
EXERCISES.pullNeg={name:'Tractions négatives',short:'Dos · Biceps · Contrôle',icon:'↓',unit:'rép.',baseSets:3,base:3,kind:'pullPrep',details:'Monte menton au-dessus de la barre avec une chaise stable, puis descends le plus lentement possible, 4 à 5 secondes, jusqu’aux bras tendus. Repose les pieds et recommence. Ne te laisse jamais tomber en bas et ne saute pas sur une tour autoportante qui bouge.'};
EXERCISES.pullAssist={name:'Tractions pieds aidés',short:'Dos · Biceps',icon:'↑',unit:'rép.',baseSets:2,base:5,kind:'pullPrep',details:'Une chaise stable sous la barre, un pied posé dessus. Tire avec les bras en poussant avec la jambe le strict nécessaire, menton au-dessus de la barre, puis redescends sous contrôle. Moins tu pousses, plus tu t’approches d’une vraie traction.'};
EXERCISES.dipHold={name:'Maintien en appui aux barres',short:'Épaules · Triceps · Gainage',icon:'⇵',unit:'s',baseSets:3,base:15,kind:'dipPrep',details:'En appui bras tendus sur les barres à dips, épaules basses et loin des oreilles, tronc gainé, jambes immobiles (pieds au sol ou sur un support si besoin). Tiens sans t’affaisser. Arrête en cas de gêne à l’épaule ou au sternum.'};
const PULL_STAGES=[{name:'Étape 0 · Suspension et omoplates',short:'Suspension active et tirages scapulaires, pour préparer épaules et prise.'},{name:'Étape 1 · Négatives 3 × 3',short:'Descente lente en 4 à 5 secondes depuis la position haute.'},{name:'Étape 2 · Négatives 3 × 5 et pieds aidés',short:'Plus de volume de tirage avant la première traction.'},{name:'Étape 3 · Premières tractions',short:'1 à 2 tractions strictes par série, négatives en complément.'},{name:'Programme tractions strictes',short:'Progression normale du cycle.'}];

function stageFromBaseline(b){b=num(b);return b<=0?0:b<3?3:4}
function pullStage(){const v=Number(store.settings.pullStage);return Number.isInteger(v)&&v>=0&&v<=4?v:stageFromBaseline(store.settings.baselinePullups)}

function settings(){const s=store.settings;return `<section class="section" style="margin-top:12px"><div class="eyebrow">Personnalisation</div><h1 class="mt8">Tes réglages.</h1><p class="small muted mt8">BARRE v4.6 · Cycle ${cycleNo()}</p><p class="lead">Tes données restent sur cet appareil. Aucun compte, aucune connexion à un serveur.</p></section><section class="section"><div class="card"><h3>Mon point de départ</h3><div class="field"><label for="startDate">Date de début des 8 semaines</label><input id="startDate" type="date" value="${esc(s.startDate)}" data-field="startDate"></div><div class="field"><label for="baseline">Tractions strictes maximales actuellement</label><select id="baseline" data-field="baselinePullups">${Array.from({length:17},(_,i)=>i).map(n=>`<option ${num(s.baselinePullups)===n?'selected':''} value="${n}">${n===0?'0 — pas encore de traction stricte':n+' traction'+(n>1?'s':'')}</option>`).join('')}</select></div><div class="two-col"><div class="field"><label for="goalPullups">Objectif tractions / série</label><select id="goalPullups" data-field="goalPullups">${[5,6,8,10,12,15,20].map(n=>`<option value="${n}" ${num(s.goalPullups)===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="goalDips">Objectif dips stricts / série</label><select id="goalDips" data-field="goalDips">${[3,5,6,8,10,12,15].map(n=>`<option value="${n}" ${num(s.goalDips)===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label for="pullStage">Étape actuelle aux tractions</label><select id="pullStage" data-field="pullStage">${PULL_STAGES.map((st,i)=>`<option value="${i}" ${pullStage()===i?'selected':''}>${esc(st.name)}</option>`).join('')}</select></div><p class="small muted">Ce maximum sert à proposer des répétitions prudentes. Tu peux modifier chaque série pendant l'entraînement.</p><button class="btn btn-secondary btn-full mt12" data-action="assessment">Modifier mon bilan sportif →</button></div></section><section class="section"><div class="card"><h3>Accueil et préférences</h3><p class="notice mt8">Choisis uniquement les indicateurs que tu souhaites voir en ouvrant BARRE.</p>${[['homeShowOverview','Afficher les records'],['homeShowRecovery','Afficher la récupération'],['homeShowGoals','Afficher les objectifs']].map(([id,label])=>`<label class="check mt12"><input type="checkbox" data-field="${id}" ${s[id]!==false?'checked':''}><span>${label}</span></label>`).join('')}<div class="two-col"><div class="field"><label for="frequency">Séances par semaine</label><select id="frequency" data-field="frequency"><option value="2" ${num(s.frequency)===2?'selected':''}>2 séances / semaine</option><option value="3" ${num(s.frequency)===3?'selected':''}>3 séances / semaine (sauf semaines allégées)</option></select></div><div class="field"><label for="duration">Temps disponible</label><select id="duration" data-field="duration">${[20,30,45,60].map(n=>`<option value="${n}" ${plannedDuration()===n?'selected':''}>${n} min (indicatif)</option>`).join('')}</select></div></div><p class="tiny muted">Les paramètres concernent les prochaines séances. Le temps est une cible indicative, pas un chronométrage garanti. Un changement de fréquence ne supprime jamais l’historique.</p><div class="two-col"><div class="field"><label for="restSeconds">Repos automatique</label><select id="restSeconds" data-field="restSeconds">${[60,90,120,150,180].map(n=>`<option value="${n}" ${num(s.restSeconds)===n?'selected':''}>${n} secondes</option>`).join('')}</select></div><div class="field"><label for="warmupToggle">Échauffement</label><select id="warmupToggle" data-field="warmup"><option value="yes" ${s.warmup!==false?'selected':''}>Afficher avant séance</option><option value="no" ${s.warmup===false?'selected':''}>Masquer</option></select></div></div><label class="check mt12"><input type="checkbox" data-field="vibrateRest" ${s.vibrateRest!==false?'checked':''}><span>Vibrer à la fin du repos si le téléphone le permet</span></label><label class="check mt12"><input type="checkbox" data-field="vibrateSet" ${s.vibrateSet!==false?'checked':''}><span>Petite vibration à la validation d’une série</span></label>${window.BarreAndroid?`<label class="check mt12"><input type="checkbox" data-field="notifRest" ${s.notifRest!==false?'checked':''}><span>Notification de fin de repos si tu quittes BARRE pendant la séance</span></label>`:''}<label class="check mt12"><input type="checkbox" data-field="soundRest" ${s.soundRest===true?'checked':''}><span>Signal sonore de fin de repos (si autorisé par le navigateur)</span></label><div class="field"><label for="legVariant">Progression des jambes</label><select data-field="legVariant" id="legVariant"><option value="standard" ${s.legVariant!=='control'?'selected':''}>Standard · Squats et pont bilatéral</option><option value="control" ${s.legVariant==='control'?'selected':''}>Contrôle · Squats tempo et pont unilatéral</option></select></div><p class="small muted">La variante contrôle ne sera proposée qu'aux prochaines séances, après évaluation médicale et maîtrise technique. Aucune augmentation automatique de difficulté.</p></div></section><section class="section"><div class="card"><h3>Mon matériel de poussée</h3><label class="check mt18"><input type="checkbox" ${s.dipsEnabled!==false?'checked':''} data-field="dipsEnabled"><span>J’ai des barres à dips stables : remplacer les pompes de la séance A par des dips</span></label><div class="field"><label for="dipsMode">Niveau actuel aux dips</label><select id="dipsMode" data-field="dipsMode" ${s.dipsEnabled===false?'disabled':''}><option value="hold" ${s.dipsMode==='hold'?'selected':''}>Pas encore de dip : maintien en appui (15 s visées)</option><option value="assist" ${s.dipsMode!=='strict'&&s.dipsMode!=='hold'?'selected':''}>Début / incertain : dips assistés (5 répétitions visées)</option><option value="strict" ${s.dipsMode==='strict'?'selected':''}>Je maîtrise les dips stricts (3 répétitions visées)</option></select></div><p class="small muted">Les dips remplacent les pompes : ils ne s’ajoutent pas en plus. Pour débuter, prends un appui stable avec les pieds si tes barres le permettent. En cas de gêne à l’épaule ou au sternum, repasse aux pompes. Les séances déjà enregistrées et une séance commencée ne sont pas modifiées.</p></div></section><section class="section"><div class="card"><h3>Mon matériel de tirage horizontal</h3><label class="check mt18"><input type="checkbox" ${s.rowsEnabled!==false?'checked':''} data-field="rowsEnabled"><span>Je dispose d’une barre basse / station réellement adaptée aux tractions australiennes</span></label><div class="field"><label for="rowsMode">Inclinaison actuelle</label><select id="rowsMode" data-field="rowsMode" ${s.rowsEnabled===false?'disabled':''}><option value="incline" ${s.rowsMode!=='horizontal'?'selected':''}>Inclinée, plus facile — 2 × 8</option><option value="horizontal" ${s.rowsMode==='horizontal'?'selected':''}>Presque horizontale, plus difficile — 2 × 6</option></select></div><div class="field"><label for="goalRows">Objectif australiennes par série</label><select id="goalRows" data-field="goalRows">${[6,8,10,12,15,20].map(n=>`<option value="${n}" ${num(s.goalRows)===n?'selected':''}>${n}</option>`).join('')}</select></div><p class="small muted">Séance B : deux séries d’australiennes remplacent une série de tractions supination et ajoutent une série nette de tirage. Les changements concernent uniquement les nouvelles séances. Ne te suspends jamais horizontalement à une barre de porte non conçue pour cet usage. Stoppe si le dos ou la jambe réagissent.</p></div></section><section class="section"><div class="card warning"><h3>Suivi médical et entraînement</h3><p class="notice mt8">Si tu as déjà eu une douleur irradiant dans la jambe, des fourmillements ou une faiblesse, sollicite une évaluation médicale avant l’entraînement. BARRE ne pose aucun diagnostic.</p><div class="field"><label for="symptomHistory">Antécédents de douleur irradiant dans la jambe ou fourmillements</label><select id="symptomHistory" data-field="symptomHistory"><option value="yes" ${s.symptomHistory!=='no'?'selected':''}>Oui / incertain — avis médical avant renforcement</option><option value="no" ${s.symptomHistory==='no'?'selected':''}>Non — contrôle des symptômes le jour de séance</option></select></div><label class="check mt18"><input type="checkbox" ${s.medicalClearance?'checked':''} data-field="medicalClearance"><span>Je confirme avoir été examiné et avoir reçu un avis médical favorable à ces exercices de renforcement, avec des adaptations si nécessaires.</span></label><p class="small muted mt12">Cette déclaration ne remplace pas un examen et n'autorise pas à s'entraîner en présence de symptômes nouveaux ou aggravés.</p></div></section><section class="section"><div class="card"><h3>Sauvegarde et confidentialité</h3><p class="notice mt8">Les données sont stockées sur cet appareil et sauvegardées à chaque série. Une copie locale de secours est conservée lorsque le navigateur le permet. Elles peuvent disparaître si tu effaces les données du site ou changes de navigateur. Exporte régulièrement une sauvegarde.</p><div class="storage-indicator" role="status">${storageError?'Dernière sauvegarde échouée':'Enregistrement local actif'}${storageWarning?' · '+esc(storageWarning):''}</div><div class="btn-row mt18"><button class="btn btn-secondary" data-action="export">↓ Exporter JSON</button><button class="btn btn-outline" data-action="import">↑ Importer</button></div><button class="btn btn-secondary btn-full mt12" data-action="exportEncrypted">Exporter une sauvegarde chiffrée (mot de passe)</button><button class="btn btn-outline btn-full mt12" data-action="restorePrevious">Récupérer la copie locale précédente</button><p class="tiny muted mt8">La copie précédente peut ne pas exister et ne remplace pas un export JSON conservé ailleurs.</p>${backupStatusBlock()}<div class="divider"></div><button class="btn btn-danger btn-full" data-action="reset">Effacer toutes mes données</button></div></section><section class="section"><div class="card"><h3>Installer sur Android</h3><p class="notice mt8">Une fois l'application hébergée en HTTPS (GitHub Pages, par exemple), ouvre-la dans Chrome, puis choisis « Installer l'application » ou « Ajouter à l'écran d'accueil » dans le menu ⋮.</p><p class="notice mt12">La mise en cache permet ensuite l'utilisation hors connexion. L'ouverture du fichier HTML seul permet le suivi local, mais pas l'installation PWA ni le mode hors ligne complet.</p></div></section><section class="section">${safeBanner()}<p class="notice mt12">Référence santé : <a href="https://www.ameli.fr/assure/sante/themes/sciatique/que-faire-quand-consulter" target="_blank" rel="noopener noreferrer">Assurance Maladie — Sciatique, quand consulter ?</a></p></section>`}

// 4.4.1 : dessins justes pour pike, fente et pont unilatéral ; légendes honnêtes ailleurs.
const EXERCISE_DRAWINGS=new Set(['pike','lunge','bridgeSingle','hang','scap','pullNeg','dipHold']);
const DRAWING_NOTES={hang:'Dessin · suspension active, épaules basses',scap:'Dessin · relâché → omoplates abaissées',pullNeg:'Dessin · en haut → descente lente',dipHold:'Dessin · appui bras tendus'};
const PHOTO_NOTES={
 squatTempo:'Même position que le squat · descente lente sur 3 s',
 pullAssist:'Pas encore d’image juste : ajoute ta photo (chaise sous la barre, un pied dessus)',
 rowHorizontal:'Version inclinée montrée · en horizontale, corps presque parallèle au sol',
 side:'Version difficile montrée (bras et jambes tendus) · ta version : avant-bras et genoux au sol'
};
const DRAWING_CREDIT='Dessins : Workout Guide (Bryl Lim), CC BY-SA 4.0, recolorés et assemblés pour BARRE';
function exercisePhoto(id){
 const e=EXERCISES[id];if(!e)return '';
 const drawing=EXERCISE_DRAWINGS.has(id);
 const note=drawing?(DRAWING_NOTES[id]||'Dessin · départ → arrivée'):(PHOTO_NOTES[id]||(window.BARRE_EMBEDDED_IMAGES?.[id]?'Illustration générée (non photographique)':'Pas encore d’image : ajoute ta photo dans la fiche'));
 const label=drawing?'Dessin du mouvement, position de départ puis d’arrivée':(PHOTO_NOTES[id]?'Illustration générée indicative':'Illustration photoréaliste générée ; vérifier la position dans les consignes');
 return `<figure class="exercise-photo-wrap"><img class="exercise-photo" data-photo-id="${esc(id)}" src="${window.BARRE_EMBEDDED_IMAGES?.[id]||PHOTO_PLACEHOLDER}" alt="${esc(label)} : ${esc(e.name)}" loading="lazy" decoding="async" width="560" height="420"><figcaption class="photo-note" data-photo-label="${esc(id)}">${esc(note)}</figcaption></figure>`;
}

function lumbarFocus(){
 const ids=['bird','bridge','side'];
 return `<section class="section lumbar-focus"><div class="section-head"><h2>Bas du dos · Stabilité</h2><span class="tag">Sans matériel</span></div><div class="card"><p class="notice">Ces trois mouvements complètent les séances A et B : Bird-dog en A, pont fessier et gainage latéral en B. Pas de volume supplémentaire imposé ; évite de refaire ces séries si tu les as déjà effectuées.</p><div class="lumbar-grid">${ids.map(id=>`<button class="lumbar-move" data-action="exerciseInfo" data-ex="${id}">${exercisePhoto(id)}<strong>${esc(EXERCISES[id].name)}</strong><span>${id==='bird'?'2 × 8 par côté · 2–3 s':id==='bridge'?'2 × 12 répétitions':'2 × 15–20 s par côté'}</span></button>`).join('')}</div><p class="small muted mt12">2 à 3 séances par semaine au total, avec récupération entre les séances. Arrête en cas de douleur ou de fourmillements dans la jambe ; évaluation médicale recommandée avant de reprendre en cas de symptômes persistants.</p></div></section>`;
}
function exerciseInfoModal(){const id=ui.exerciseId,e=EXERCISES[id];if(!e)return '';return `<div class="modal-mask"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="exerciseTitle"><div class="modal-head"><div class="eyebrow">Fiche technique</div><button class="iconbtn" aria-label="Fermer" data-action="closeModal">✕</button></div><h2 id="exerciseTitle">${esc(e.name)}</h2>${exercisePhoto(id)}<p class="notice mt12">${esc(e.details)}</p><div class="card photo-choice mt18"><strong>Photo authentique (facultatif)</strong><p class="small muted mt8">Importe une photo dont tu disposes des droits, prise pendant le mouvement. Elle reste sur cet appareil, hors ligne, et remplace l’illustration dans les fiches et les séances.</p><label class="photo-upload-label" for="customExercisePhoto">Choisir une photo JPEG, PNG ou WebP (15 Mo max)</label><input type="file" id="customExercisePhoto" accept="image/jpeg,image/png,image/webp" data-photo-upload="${esc(id)}"><button class="btn btn-outline btn-full mt12" data-action="photoRemove" data-ex="${esc(id)}">Retirer la photo personnelle</button></div><div class="card warning mt18"><p class="small">Visuels générés ou dessinés pour illustrer les exercices ; ils ne remplacent pas une démonstration professionnelle. ${EXERCISE_DRAWINGS.has(id)?esc(DRAWING_CREDIT)+' (<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener noreferrer">licence</a>).':''} Pour les variantes, lis les consignes. Arrête en cas de douleur, de fourmillements ou de faiblesse.</p></div><button class="btn btn-primary btn-full mt18" data-action="closeModal">Compris</button></div></div>`;}

function workout(){
 const d=store.draft;if(!d)return home();
 const total=d.exercises.reduce((n,e)=>n+e.sets.length,0),done=d.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),guided=store.settings.guided!==false,focus=clamp(ui.focus,0,d.exercises.length-1);
 const cards=(guided?d.exercises.map((e,i)=>[e,i]).filter(([e,i])=>i===focus):d.exercises.map((e,i)=>[e,i])).map(([e,i])=>{
  const unit=esc(e.unit);const next=e.sets.findIndex(set=>!set.done);
  return `<article class="card exercise-card workout-card"><div class="card-header"><span class="eyebrow">EXERCICE ${i+1} / ${d.exercises.length}</span><span class="tag">${e.sets.filter(t=>t.done).length} / ${e.sets.length} séries</span></div><h2 class="mt12">${esc(e.name)}</h2><p class="small muted mt8">${esc(EXERCISES[e.id]?.short||'')}</p><p class="training-advice">${esc(movementAdvice(e.id).message)}</p><div class="exercise-visual compact-photo">${exercisePhoto(e.id)}<button class="text-button" data-action="exerciseInfo" data-ex="${e.id}">Consignes, sécurité et ta photo ↗</button></div>
 <div class="replacement-line"><label for="swap-${i}">Variante / remplacement</label><select id="swap-${i}" data-swap="${i}" ${e.sets.some(t=>t.done)?'disabled':''}><option value="${esc(e.id)}">${esc(e.name)} (actuel)</option>${exerciseAlternatives(e.id).filter(id=>EXERCISES[id]).map(id=>`<option value="${id}">${esc(EXERCISES[id].name)}</option>`).join('')}</select><p class="tiny muted">Remplacement possible avant la première série uniquement. Vérifier l’équipement et la technique.</p></div><div class="set-list">${e.sets.map((set,j)=>`<div class="set-row ${set.done?'done':''} ${j===next?'next-set':''}"><div class="set-meta"><strong>Série ${j+1}</strong><span class="tiny muted">Cible : ${set.target} ${unit}</span></div><div class="rep-control"><button class="roundbtn" data-action="reps" data-e="${i}" data-s="${j}" data-n="-1" aria-label="Enlever une répétition à la série ${j+1}">−</button><div class="rep-count"><div class="rep-number">${num(set.actual)}</div><div class="tiny muted right">${unit}</div></div><button class="roundbtn" data-action="reps" data-e="${i}" data-s="${j}" data-n="1" aria-label="Ajouter une répétition à la série ${j+1}">+</button></div><button class="done-btn ${set.done?'checked':''}" data-action="setDone" data-e="${i}" data-s="${j}" aria-pressed="${!!set.done}">${set.done?'✓ Fait':'Valider'}</button>${isTimed(e.id)?holdButton(i,j,set):''}<div class="set-feedback"><span class="tiny muted">Répétitions en réserve</span>${[0,1,2,3].map(v=>`<button class="feedback-chip ${(set.rir!==null&&num(set.rir)===v)?'active':''}" data-action="setRir" data-e="${i}" data-s="${j}" data-value="${v}" aria-pressed="${(set.rir!==null&&num(set.rir)===v)}">${v===3?'3+':v}</button>`).join('')}<button class="feedback-chip ${set.quality==='adjust'?'flagged':''}" data-action="setQuality" data-e="${i}" data-s="${j}" aria-pressed="${set.quality==='adjust'}">${set.quality==='adjust'?'Technique à corriger':set.quality==='ok'?'Technique OK':'Technique ?'}</button></div></div>`).join('')}</div></article>`}).join('');

 if(unsafe){
  store.settings.symptomHistory='yes';store.settings.medicalClearance=false;
  if(store.draft){const d=store.draft;store.postponed[slotKey(d.week,d.slot)]='medical';const n=d.exercises.reduce((sum,e)=>sum+e.sets.filter(t=>t.done).length,0);
   if(n)store.sessions.push({...d,endedAt:new Date().toISOString(),effort:3,after:'worse',status:'partial',note:'Interrompue après déclaration de symptômes pendant la récupération'});

function loadPulse(){
 const now=Date.now(),s=store.sessions.filter(s=>s.endedAt&&Number.isFinite(Date.parse(s.endedAt)));
 const count=(a,b)=>s.filter(x=>{const d=(now-Date.parse(x.endedAt))/86400000;return d>=a&&d<b}).reduce((n,x)=>n+(x.exercises||[]).reduce((k,e)=>k+(e.sets||[]).filter(t=>t.done).length,0),0);
 const current=count(0,7),prior=count(7,14);const actIn=(a,b)=>(store.activities||[]).filter(x=>{const d=(now-Date.parse(x.at))/86400000;return d>=a&&d<b});const act=actIn(0,7),actPrev=actIn(7,14);const actMin=act.reduce((n,x)=>n+num(x.minutes),0),actPrevMin=actPrev.reduce((n,x)=>n+num(x.minutes),0);const delta=current-prior;
 const r=readiness();return {actCount:act.length,actMin,actPrevMin,current,prior,delta,advice:r.level==='danger'?'Symptômes signalés : suspendre les efforts et demander un avis médical.':r.level==='warning'?'Récupération difficile : conserver ou diminuer le volume ; éviter une hausse.':current>prior*1.35&&prior>0?'Le volume a nettement augmenté. Privilégie la récupération et évite toute hausse supplémentaire.':current===0?'Aucune série enregistrée cette semaine. Aucune séance de rattrapage n’est imposée.':'Volume suivi. N’augmente qu’après des séances bien tolérées et avec une technique propre.'};
}
function chartSeries(id,scope){
 const list=store.sessions.filter(s=>scope==='all'||(s.cycle||1)===cycleNo()).slice().sort((a,b)=>Date.parse(a.endedAt)-Date.parse(b.endedAt));
 return list.flatMap(s=>(s.exercises||[]).filter(e=>e.id===id).map(e=>({when:s.endedAt,best:Math.max(0,...e.sets.filter(t=>t.done).map(t=>num(t.actual))),sets:e.sets.filter(t=>t.done).length}))).filter(x=>x.best>0).slice(-16);
}
function trendChart(){
 const id=EXERCISES[ui.statsExercise]?ui.statsExercise:'pullP',scope=ui.statsScope,series=chartSeries(id,scope),max=Math.max(1,...series.map(x=>x.best));
 const points=series.map((x,i)=>({x:series.length===1?160:35+(270*i/(series.length-1)),y:140-100*x.best/max,...x}));
 const path=points.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 return `<section class="section"><div class="card"><div class="card-header"><h3>Évolution par mouvement</h3><span class="tag">${series.length} séances</span></div>

async function encryptBackup(){
 if(typeof crypto==='undefined'||!crypto.subtle){notify('Chiffrement non disponible dans ce navigateur : utilise BARRE en HTTPS.');return}
 const pass=window.prompt('Mot de passe de la sauvegarde chiffrée (12 caractères minimum). Il ne sera pas conservé.');
 if(pass===null)return;if(pass.length<12){notify('Mot de passe trop court : 12 caractères minimum');return}
 const confirmation=window.prompt('Confirme ce mot de passe :');if(confirmation!==pass){notify('Les mots de passe ne correspondent pas');return}
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const encoder=new TextEncoder();
  const material=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt']);
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoder.encode(JSON.stringify({...store,photos:await collectPhotos()})));
  const b64=buf=>{const bytes=new Uint8Array(buf);let chars='';for(let i=0;i<bytes.length;i+=32768)chars+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(chars)};
  const envelope={format:'barre-encrypted-v1',kdf:'PBKDF2-SHA256',iterations:210000,salt:b64(salt),iv:b64(iv),payload:b64(encrypted),createdAt:new Date().toISOString()};
  downloadBackup(JSON.stringify(envelope,null,2),'barre-protegee-'+TODAY()+'.json');store.settings.lastExportAt=new Date().toISOString();persist();notify('Sauvegarde protégée créée. Conserve ton mot de passe.');
 }catch(e){console.error(e);notify('Impossible de chiffrer cette sauvegarde')}
}
async function decryptBackup(envelope){
 if(!crypto?.subtle||envelope.format!=='barre-encrypted-v1'||envelope.kdf!=='PBKDF2-SHA256'||envelope.iterations!==210000)throw new Error('Format chiffré incompatible');
 const password=window.prompt('Mot de passe de la sauvegarde protégée :');if(password===null)throw new Error('Import annulé');
 const un64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
 if([envelope.salt,envelope.iv,envelope.payload].some(x=>typeof x!=='string'||x.length>30000000))throw new Error('Fichier incorrect');
 const salt=un64(envelope.salt),iv=un64(envelope.iv);if(salt.length!==16||iv.length!==12)throw new Error('Métadonnées incorrectes');
 const encoder=new TextEncoder(),material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,un64(envelope.payload));return JSON.parse(new TextDecoder().decode(bytes));
}
function downloadBackup(content,name){
  // APK : Android ouvre son sélecteur (Storage Access Framework). Transfert découpé (fiable pour les gros exports).
  if(window.BarreAndroid&&typeof window.BarreAndroid.beginSaveFile==='function'){
    const bytes=new TextEncoder().encode(content),chunkSize=24576;
    try{
      window.__barrePrevExport=store.settings.lastExportAt||null;
      window.BarreAndroid.beginSaveFile(name,'application/json',bytes.byteLength);
      for(let start=0;start<bytes.length;start+=chunkSize){
        let chars='';const part=bytes.subarray(start,Math.min(start+chunkSize,bytes.length));
        for(let i=0;i<part.length;i++)chars+=String.fromCharCode(part[i]);
        window.BarreAndroid.appendSaveChunk(btoa(chars));
      }
      window.BarreAndroid.finishSaveFile();return;
    }catch(e){console.error('Export Android',e);notify('Impossible de préparer la sauvegarde Android');return}
  }
  const blob=new Blob([content],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)
}

 if(!medicalReady())return {ready:false,text:'Progression en pause : confirme ta situation médicale dans Réglages → Suivi médical.'};
 if(['danger','warning'].includes(readiness().level))return {ready:false,text:'Progression en pause : ta récupération ou des symptômes sont à vérifier (État du jour).'};
 const clean=(sess,id,min)=>{const e=(sess.exercises||[]).find(x=>x.id===id);return !!e&&e.sets.length>0&&e.sets.every(t=>t.done&&num(t.actual)>=min&&t.quality!=='adjust')&&sess.after==='none'&&num(sess.effort)<=3};
 const lastTwo=pred=>store.sessions.filter(x=>x.status==='complete'&&(x.exercises||[]).some(pred)).slice(-2);
 let ok;
 if(st===3){const l=lastTwo(e=>e.id==='pullP'||e.id==='pullS');ok=l.length===2&&l.every(x=>clean(x,x.exercises.some(e=>e.id==='pullP')?'pullP':'pullS',3))}
 else{const keys=st===0?[['hang',20],['scap',6]]:st===1?[['pullNeg',3]]:[['pullNeg',5]];ok=keys.every(([id,min])=>{const l=lastTwo(e=>e.id===id);return l.length===2&&l.every(x=>clean(x,id,min))})}
 const goal=st===0?'2 séances propres avec 20 s de suspension active et 6 tirages scapulaires par série':st===1?'2 séances propres à 3 négatives lentes par série':st===2?'2 séances propres à 5 négatives lentes par série':'2 séances propres à 3 tractions strictes par série';
 return {ready:ok,text:ok?'Objectif atteint : tu peux passer à l’étape suivante.':'Pour passer à l’étape suivante : '+goal+'.'}}
function pullStageCard(){const st=pullStage();
 if(st>=4){if(bestPull()>0||store.settings.stageHintHidden)return '';return `<section class="section"><div class="card soft"><h3>Pas encore de traction stricte ?</h3><p class="notice mt8">BARRE peut commencer par la suspension active et les tirages scapulaires, puis les négatives, jusqu’à ta première traction.</p><div class="btn-row mt12"><button class="btn btn-secondary" data-action="stageSet" data-value="0">Commencer à l’étape 0</button><button class="btn btn-outline" data-action="stageHintHide">Masquer</button></div></div></section>`}
 const c=stageCheck();
 return `<section class="section"><div class="section-head"><h2>Vers ta première traction</h2><span class="tag">Étape ${st}/3</span></div><div class="card"><strong>${esc(PULL_STAGES[st].name)}</strong><p class="small muted mt8">${esc(PULL_STAGES[st].short)}</p><div class="stage-track mt12" aria-hidden="true">${[0,1,2,3].map(i=>`<span class="stage-dot ${i<st?'done':i===st?'current':''}"></span>`).join('')}</div><p class="notice mt12">${esc(c.text)}</p>${c.ready?`<button class="btn btn-primary btn-full mt12" data-action="stageUp">Passer à : ${esc(PULL_STAGES[st+1].name)} →</button>`:''}</div></section>`}
function stageUp(){const st=pullStage();if(st>=4)return;if(!stageCheck().ready){notify('Objectif de l’étape pas encore atteint');return}if(!confirm('Passer à « '+PULL_STAGES[st+1].name+' » ? Une séance déjà commencée ne change pas.'))return;store.settings.pullStage=st+1;if(st+1===4)store.settings.baselinePullups=Math.max(num(store.settings.baselinePullups),3);if(!persist())return;render();notify(PULL_STAGES[st+1].name)}

ngs.medicalClearance=false;persist();render();break;case 'medicalClearance':store.settings.medicalClearance=!!t.checked;persist();notify(t.checked?'Avis médical déclaré — vérification toujours nécessaire':'Déclaration retirée');break;}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.input==='finishNote')ui.finish.note=t.value;if(t.dataset.activity==='note'&&ui.activityDraft)ui.activityDraft.note=t.value.slice(0,500)});
$('#importFile').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;if(file.size>30000000){notify('Fichier trop volumineux (max 30 Mo)');return}try{let data=JSON.parse(await file.text());if(data?.format==='barre-encrypted-v1')data=await decryptBackup(data);if(!validImport(data)){notify('Sauvegarde non valide');return}if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;const next=fresh();next.settings={...next.settings,...data.settings,medicalClearance:false,symptomHistory:data.settings.symptomHistory==='no'?'no':'yes',cycle:clamp(num(data.settings.cycle)||1,1,100),dipsEnabled:data.settings.dipsEnabled!==false,dipsMode:['strict','hold'].includes(data.settings.dipsMode)?data.settings.dipsMode:'assist',pullStage:Number.isInteger(+data.settings.pullStage)&&+data.settings.pullStage>=0&&+data.settings.pullStage<=4?+data.settings.pullStage:stageFromBaseline(data.settings.baselinePullups),autoBackup:!!store.settings.autoBackup,lastAutoBackupAt:store.settings.lastAutoBackupAt||null,rowsEnabled:data.settings.rowsEnabled!==false,rowsMode:data.settings.rowsMode==='horizontal'?'horizontal':'incline',goalRows:clamp(num(data.settings.goalRows)||12,1,30)};next.sessions=data.sessions.map(s=>({...s,exercises:s.exercises.map(e=>({...e,sets:e.sets.map(t=>({...t,rir:t.rir===null||t.rir===undefined?null:clamp(num(t.rir),0,3),quality:['ok','adjust'].includes(t.quality)?t.quality:null}))}))}));next.checkins=data.checkins;next.weeklyReviews=data.weeklyReviews;next.recovery=Array.isArray(data.recovery)?data.recovery.slice(-2000):[];next.postponed=data.postponed&&typeof data.postponed==='object'?data.postponed:{};next.activities=Array.isArray(data.activities)?data.activities.filter(validActivity).slice(-3000):[];next.draft=validDraft(data.draft)?data.draft:null;store=next;if(!persist())return;ui.week=currentWeek();go('home');let nPhotos=0;if(data.photos&&validPhotos(data.photos))nPhotos=await importPhotos(data.photos);render();notify('Sauvegarde importée'+(nPhotos?` (${nPhotos} photo${nPhotos>1?'s':''})`:'')+'. Avis médical à reconfirmer.')}catch(e){notify('Impossible de lire ce fichier JSON')}});
window.addEventListener('error',e=>console.error('BARRE',e.message));
document.addEventListener('keydown',e=>{
 if(!ui.modal)return;
 const dialog=document.querySelector('.modal');if(!dialog)return;
 if(e.key==='Escape'){
  if(ui.modal==='interrupt'&&(!medicalReady()||latestUnsafeToday())){ui.modal=null;go('home');return}
  ui.modal=null;render();return;
 }
 if(e.key!=='Tab')return;
 const els=[...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(el=>el.getClientRects().length);
 if(!els.length){e.preventDefault();dialog.focus();return}
 const first=els[0],last=els.at(-1);
 if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==lastStorageRaw){storageWarning='Données modifiées dans un autre onglet : recharge cette page avant d’écrire.';notify(storageWarning)}});
if(false&&'serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker non enregistré',e)))}
render(false);
if(typeof indexedDB!=='undefined')window.addEventListener('load',offerBackupRecovery);

</script>
